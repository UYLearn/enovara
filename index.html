<html lang="en">

<title>Enovara Technologies — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #081428;
    --navy: #0E2140;
    --navy-2: #163459;
    --teal: #2BAFCB;
    --teal-dim: #1C7C93;
    --orange: #F2A24D;
    --orange-dim: #C97C31;
    --paper: #FFFFFF;
    --mist: #EEF3F7;
    --text-dim: #A9BAD0;
    --text-dimmer: #6E82A0;
    --glass-border: rgba(255,255,255,0.09);
    --glass-fill: rgba(255,255,255,0.035);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: radial-gradient(120% 100% at 50% -10%, #16305A 0%, #0E2140 42%, #081428 100%);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  canvas#network{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  .glow{
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow--teal{
    width: 44vw; height: 44vw;
    max-width: 620px; max-height: 620px;
    top: -16vw; left: -14vw;
    background: radial-gradient(circle, rgba(43,175,203,0.32), transparent 70%);
  }
  .glow--orange{
    width: 38vw; height: 38vw;
    max-width: 540px; max-height: 540px;
    bottom: -14vw; right: -10vw;
    background: radial-gradient(circle, rgba(242,162,77,0.26), transparent 70%);
  }

  .wrap{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 7vh 6vw 3vh;
    text-align: center;
  }

  .plate{
    background: var(--paper);
    border-radius: 20px;
    padding: 1.6rem 2.4rem;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 20px 60px -20px rgba(4, 14, 32, 0.65);
    position: relative;
    margin-bottom: 2.4rem;
    opacity: 0;
    transform: translateY(16px) scale(0.97);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }
  .plate::before{
    content: '';
    position: absolute;
    inset: -1.5px;
    border-radius: 21.5px;
    padding: 1.5px;
    background: linear-gradient(120deg, var(--teal), var(--orange));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.55;
    pointer-events: none;
  }
  .plate img{
    width: min(300px, 52vw);
    height: auto;
    display: block;
  }

  .eyebrow-line{
    width: min(220px, 50vw);
    height: 12px;
    margin: 0 auto 1.9rem;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
  }
  .eyebrow-line path{
    fill: none;
    stroke: url(#flourish-gradient);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 320;
    stroke-dashoffset: 320;
    animation: draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.7s forwards;
  }

  h1{
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 4.6vw, 3.4rem);
    line-height: 1.16;
    letter-spacing: -0.01em;
    max-width: 16ch;
    margin: 0 0 1.1rem;
    color: var(--paper);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
  }
  h1 em{
    font-style: normal;
    background: linear-gradient(100deg, var(--teal), var(--orange));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lede{
    font-size: 1.06rem;
    line-height: 1.65;
    color: var(--text-dim);
    max-width: 44ch;
    margin: 0 0 2.6rem;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
  }

  .countdown{
    display: flex;
    gap: 0.9rem;
    margin-bottom: 2.6rem;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
  }
  .countdown .unit{
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 0.85rem 0.4rem 0.7rem;
    width: 4.6rem;
    backdrop-filter: blur(6px);
  }
  .countdown .num{
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.7rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--paper);
    line-height: 1;
    display: block;
  }
  .countdown .lbl{
    display: block;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--text-dimmer);
    margin-top: 0.4rem;
  }
  @media (max-width: 420px){
    .countdown{ gap: 0.5rem; }
    .countdown .unit{ width: 3.9rem; padding: 0.7rem 0.2rem 0.55rem; }
    .countdown .num{ font-size: 1.35rem; }
  }

  form{
    display: flex;
    gap: 0.6rem;
    width: 100%;
    max-width: 440px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
  }
  @media (max-width: 480px){
    form{ flex-direction: column; }
  }

  input[type="email"]{
    flex: 1;
    min-width: 0;
    padding: 0.9rem 1.1rem;
    border-radius: 10px;
    border: 1.5px solid var(--glass-border);
    background: var(--glass-fill);
    backdrop-filter: blur(6px);
    font-family: 'Inter', sans-serif;
    font-size: 0.96rem;
    color: var(--paper);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  input[type="email"]::placeholder{ color: var(--text-dimmer); }
  input[type="email"]:focus{
    border-color: var(--teal);
    background: rgba(255,255,255,0.06);
  }
  input[type="email"]:focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  button{
    padding: 0.9rem 1.6rem;
    border-radius: 10px;
    border: none;
    background: linear-gradient(100deg, var(--teal), var(--orange));
    color: #071322;
    font-family: 'Inter', sans-serif;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.2s ease, transform 0.15s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  button:focus-visible{
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }
  button:disabled{ opacity: 0.65; cursor: default; }

  .status{
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--text-dim);
    min-height: 1.3em;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
  }
  .status.is-success{ color: var(--teal); font-weight: 500; }
  .status.is-error{ color: #E38870; }

  .social{
    display: flex;
    gap: 1rem;
    margin-top: 2.3rem;
    opacity: 0;
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards;
  }
  .social a{
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-fill);
    color: var(--text-dim);
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .social a:hover{
    color: var(--paper);
    border-color: var(--teal);
    transform: translateY(-2px);
  }
  .social svg{ width: 16px; height: 16px; fill: currentColor; }

  footer{
    position: relative;
    z-index: 1;
    padding: 1.7rem 6vw 2.2rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--text-dimmer);
    opacity: 0;
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .plate, .eyebrow-line, h1, p.lede, .countdown, form, .status, .social, footer{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .eyebrow-line path{
      animation: none !important;
      stroke-dashoffset: 0 !important;
    }
  }
</style>
</head>

  <footer>ENOVARA TECHNOLOGIES &nbsp;·&nbsp; GURUGRAM, INDIA &nbsp;·&nbsp; <span id="year"></span></footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- Countdown ---------- */
  // Update this to your real launch date/time (local time of the visitor).
  var LAUNCH_DATE = new Date('2026-11-15T00:00:00');

  function updateCountdown(){
    var now = new Date();
    var diff = LAUNCH_DATE - now;
    if (diff < 0) diff = 0;
    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var mins = Math.floor((diff / (1000 * 60)) % 60);
    var secs = Math.floor((diff / 1000) % 60);
    document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
    document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
    document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* ---------- Ambient network canvas ---------- */
  (function () {
    var canvas = document.getElementById('network');
    var ctx = canvas.getContext('2d');
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var width, height, dpr;
    var nodes = [];
    var NODE_COUNT = 46;
    var LINK_DIST = 130;
    var running = true;

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initNodes(){
      nodes = [];
      var count = width < 640 ? Math.round(NODE_COUNT * 0.5) : NODE_COUNT;
      for (var i = 0; i < count; i++){
        nodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18
        });
      }
    }

    function step(){
      if (!running) return;
      ctx.clearRect(0, 0, width, height);

      for (var i = 0; i < nodes.length; i++){
        var n = nodes[i];
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > width) n.vx *= -1;
        if (n.y < 0 || n.y > height) n.vy *= -1;
      }

      for (var i = 0; i < nodes.length; i++){
        for (var j = i + 1; j < nodes.length; j++){
          var a = nodes[i], b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < LINK_DIST){
            var alpha = (1 - dist / LINK_DIST) * 0.18;
            ctx.strokeStyle = 'rgba(140, 190, 210,' + alpha + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for (var i = 0; i < nodes.length; i++){
        var n = nodes[i];
        ctx.beginPath();
        ctx.arc(n.x, n.y, 1.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180, 215, 230, 0.55)';
        ctx.fill();
      }

      requestAnimationFrame(step);
    }

    resize();
    initNodes();

    if (prefersReducedMotion){
      // Draw a single static frame instead of animating continuously.
      step();
      running = false;
    } else {
      requestAnimationFrame(step);
      document.addEventListener('visibilitychange', function(){
        running = document.visibilityState === 'visible';
        if (running) requestAnimationFrame(step);
      });
    }

    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function(){
        resize();
        initNodes();
      }, 150);
    });
  })();

  /* ---------- Notify form ---------- */
  (async function () {
    var form = document.getElementById('notify-form');
    var emailInput = document.getElementById('email');
    var button = document.getElementById('submit-btn');
    var status = document.getElementById('form-status');

    var db = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        db = await window.claude.use('db');
      }
    } catch (e) {
      db = null;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = emailInput.value.trim();
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(email)) {
        status.textContent = 'Please enter a valid email address.';
        status.className = 'status is-error';
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending…';
      status.textContent = '';
      status.className = 'status';

      try {
        if (db) {
          await db.collection('subscribers').add({
            email: email,
            submittedAt: new Date().toISOString()
          });
        }
        status.textContent = "You're on the list. We'll be in touch.";
        status.className = 'status is-success';
        form.reset();
        button.textContent = 'Notify me';
        button.disabled = false;
      } catch (err) {
        status.textContent = 'Something went wrong. Please try again in a moment.';
        status.className = 'status is-error';
        button.textContent = 'Notify me';
        button.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
